name: Android APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '9.6.0' }
   - uses: android-actions/setup-android@v3
   - run: sdkmanager --licenses > /dev/null || true
   - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
   - run: sed -i 's/compileSdk 37/compileSdk 35/; s/targetSdk 37/targetSdk 35/' app/build.gradle
   - run: gradle :app:assembleDebug --no-daemon
   - uses: actions/upload-artifact@v4
     with: { name: saveshot-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }